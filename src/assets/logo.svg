<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients matching NOVAX frontend theme -->
    <linearGradient id="novax-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <linearGradient id="brain-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="n-letter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="text-ai-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="text-sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="36" fill="url(#novax-bg-grad)"/>

  <g transform="translate(0, -10)">
    <!-- Outer Sparkles / Stars -->
    <g fill="#A78BFA" opacity="0.8" filter="url(#neon-glow)">
      <!-- Top Left Sparkle -->
      <path d="M 100 70 Q 100 80 90 80 Q 100 80 100 90 Q 100 80 110 80 Q 100 80 100 70 Z"/>
      <!-- Top Right Sparkle -->
      <path d="M 400 75 Q 400 85 390 85 Q 400 85 400 95 Q 400 85 410 85 Q 400 85 400 75 Z"/>
      <!-- Mid Left Sparkle -->
      <path d="M 70 210 Q 70 216 64 216 Q 70 216 70 222 Q 70 216 76 216 Q 70 216 70 210 Z"/>
      <!-- Mid Right Sparkle -->
      <path d="M 430 220 Q 430 226 424 226 Q 430 226 430 232 Q 430 226 436 226 Q 430 226 430 220 Z"/>
    </g>

    <!-- Brain Emblem Outer Glow Contour -->
    <g filter="url(#intense-glow)">
      <!-- Left Brain Hemisphere -->
      <path d="M 240, 70 
               C 210, 68 180, 78 160, 95 
               C 135, 95 115, 115 112, 140 
               C 90, 150 80, 175 82, 200 
               C 80, 225 92, 248 110, 260 
               C 105, 280 115, 305 135, 318 
               C 155, 332 185, 335 205, 325 
               C 220, 320 235, 305 240, 290 Z" 
            fill="none" stroke="url(#brain-glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Right Brain Hemisphere -->
      <path d="M 260, 70 
               C 290, 68 320, 78 340, 95 
               C 365, 95 385, 115 388, 140 
               C 410, 150 420, 175 418, 200 
               C 420, 225 408, 248 390, 260 
               C 395, 280 385, 305 365, 318 
               C 345, 332 315, 335 295, 325 
               C 280, 320 265, 305 260, 290 Z" 
            fill="none" stroke="url(#brain-glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Inner Circuit Lines & Nodes -->
    <g stroke="url(#cyan-accent)" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round">
      <!-- Left Circuits -->
      <path d="M 140 125 L 180 125 L 195 145 H 225"/>
      <path d="M 120 180 L 155 180 L 170 165 L 210 165"/>
      <path d="M 130 230 L 160 230 L 180 210 L 215 210"/>
      <path d="M 150 285 L 175 285 L 195 260 H 220"/>
      <path d="M 210 90 V 120 L 225 135"/>
      <path d="M 190 310 V 280 L 210 260"/>

      <!-- Right Circuits -->
      <path d="M 360 125 L 320 125 L 305 145 H 275"/>
      <path d="M 380 180 L 345 180 L 330 165 L 290 165"/>
      <path d="M 370 230 L 340 230 L 320 210 L 285 210"/>
      <path d="M 350 285 L 325 285 L 305 260 H 280"/>
      <path d="M 290 90 V 120 L 275 135"/>
      <path d="M 310 310 V 280 L 290 260"/>
    </g>

    <!-- Circuit Nodes (Dots) -->
    <g fill="url(#cyan-accent)" filter="url(#neon-glow)">
      <circle cx="140" cy="125" r="4.5"/>
      <circle cx="120" cy="180" r="4.5"/>
      <circle cx="130" cy="230" r="4.5"/>
      <circle cx="150" cy="285" r="4.5"/>
      <circle cx="210" cy="90" r="4.5"/>
      <circle cx="190" cy="310" r="4.5"/>

      <circle cx="360" cy="125" r="4.5"/>
      <circle cx="380" cy="180" r="4.5"/>
      <circle cx="370" cy="230" r="4.5"/>
      <circle cx="350" cy="285" r="4.5"/>
      <circle cx="290" cy="90" r="4.5"/>
      <circle cx="310" cy="310" r="4.5"/>
    </g>

    <!-- Central 'N' Emblem -->
    <g filter="url(#intense-glow)">
      <!-- Glowing Background Shield for 'N' -->
      <rect x="202" y="122" width="96" height="136" rx="20" fill="#0D1220" stroke="url(#brain-glow)" stroke-width="4" opacity="0.95"/>
      
      <!-- Stylized 'N' Character -->
      <path d="M 224 230 V 150 H 238 L 262 202 V 150 H 276 V 230 H 262 L 238 178 V 230 Z" 
            fill="url(#n-letter-grad)"/>
    </g>

    <!-- Text Below Emblem -->
    <!-- NOVAX - AI -->
    <text x="250" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="6" text-anchor="middle">
      <tspan fill="#F8FAFC">NOVAX-</tspan><tspan fill="url(#text-ai-grad)">AI</tspan>
    </text>

    <!-- AI PERSONAL AGENT -->
    <text x="250" y="450" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="10" fill="url(#text-sub-grad)" text-anchor="middle">
      AI PERSONAL AGENT
    </text>
  </g>
</svg>
